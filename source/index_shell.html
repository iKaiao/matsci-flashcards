<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="材料科学基础学习指导：疑难解析、例题、习题记忆卡片，随卡笔记，间隔复习，离线学习，支持手机、平板和电脑。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>材料科学基础 · 记忆卡片与学习笔记</title>
<style>
__APP_CSS__
</style>
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="导航与章节列表">
    <div class="brand"><div class="brand-icon">M</div><div><strong>材料科学基础</strong><small>MEMORY STUDIO</small></div></div>
    <nav class="side-section" aria-label="导航"><div class="side-kicker">学习空间</div><div id="navList"></div></nav>
    <nav class="side-section" aria-label="教材章节"><div class="side-kicker">CHAPTERS / 章节</div><div id="chapterList"></div></nav>
    <div class="side-footer"><div><b id="sidebarTotal">—</b> 张卡片 · 11 章</div><div>来自《材料科学基础学习指导》</div><div>学习笔记保存在本机浏览器</div><button class="btn tiny" data-action="import-backup" style="width:100%;margin-top:12px">⇧ 导入另一设备的备份</button></div>
  </aside>
  <div class="content-shell">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuBtn" aria-label="打开章节目录">☰</button>
      <label class="search"><input id="globalSearch" placeholder="搜索知识点、例题、公式…" aria-label="搜索卡片" autocomplete="off"></label>
      <div class="toolbar-actions">
        <span class="light-text" id="cardCountHeader"></span>
        <button class="btn tiny" data-action="export-backup" title="导出全部笔记和学习进度">↓ 备份</button>
        <button class="btn tiny" data-action="import-backup" title="导入进度和笔记备份">↑ 导入</button>
        <button class="icon-btn" id="fontBtn" title="切换阅读字号" aria-label="切换字号">A⁺</button>
        <button class="icon-btn" id="themeBtn" title="切换明暗模式" aria-label="切换明暗模式">☾</button>
        <button class="icon-btn" id="shortcutBtn" title="快捷键帮助" aria-label="快捷键帮助">?</button>
      </div>
    </header>
    <main id="mainView" class="main" aria-live="polite"></main>
  </div>
</div>
<div id="sidebarBackdrop" class="backdrop" aria-hidden="true"></div>
<div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>
<section class="drawer" id="drawer" role="dialog" aria-label="随卡笔记">
  <div class="drawer-bar"></div>
  <div class="note-top"><div><h2 class="note-heading" id="drawerTitle">✎ 随卡笔记</h2><p class="note-sub">输入后自动保存在当前浏览器</p></div><button class="icon-btn" data-action="close-drawer" aria-label="关闭笔记">×</button></div>
  <textarea id="mobileNoteInput" placeholder="随时记下自己的理解、公式、推导、易错点..."></textarea>
  <div class="note-footer"><span class="note-save"><span class="dot"></span>输入后自动保存</span><button class="btn tiny primary" data-action="close-drawer">保存并返回卡片</button></div>
</section>
<button id="mobileNoteBtn" class="mobile-note">✎ 写笔记</button>
<div id="editModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="更正卡片文字">
  <div class="modal">
    <h2>更正卡片文字</h2>
    <p>扫描件有时会把数学符号、上下标或图注识别错。可以在这里手动更正；原书 PDF 不受影响。更正内容可随学习记录备份。</p>
    <label for="editFront">题目</label><textarea id="editFront" spellcheck="false"></textarea>
    <label for="editBack">参考解析</label><textarea id="editBack" spellcheck="false" style="min-height:215px"></textarea>
    <div class="modal-actions"><button class="btn danger" data-action="reset-edit">恢复原版文字</button><button class="btn" data-action="close-edit">取消</button><button class="btn primary" data-action="save-edit">保存更正</button></div>
  </div>
</div>
<input type="file" id="backupInput" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script id="embedded-data" type="application/json">__CARDS_DATA__</script>
<script>
__APP_JS__
</script>
</body>
</html>
